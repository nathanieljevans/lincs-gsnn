run_id: all_edges_no_mirna_01

dirs:
  data: /home/exacloud/gscratch/mcweeney_lab/evans/data    
  extdata: ../extdata/
  runs: /home/exacloud/gscratch/mcweeney_lab/evans/lincs-modeling/outputs/lincs-gsnn
  preds: /home/exacloud/gscratch/mcweeney_lab/evans/lincs-modeling/outputs/lincs-traj/runs/exp/default_v03/output/predict_grid
  bio_network: bionetwork 
  pretrain: pretrain

scripts:
  make_bio_network:     ../scripts/make_bio_network.py
  pretrain:             ../scripts/pretrain_gsnn_with_dxdt.py
  contrastive_explanation: ../scripts/contrastive_explanation.py
  aggregate_contrastive: ../scripts/aggregate_contrastive_results.py

make_bio_network: 
  include_mirna:    ''
  include_extra:    '' #'--include_extra'
  dorothea_levels:  'ABC' 
  max_dti_kd:       1000.0
  filter_depth:     8
  remove_output_edges: '' # '--remove_output_edges' # '--remove_output_edges' to enable edge removal
  n_edges_to_remove: 0
  seed: 0
  
pretrain: 
  batch_size: 256
  num_workers: 16 
  epochs: 20
  lr: 1e-3
  wd: 0
  init: 'degree_normalized'
  patience: 3
  channels: 4
  layers: 8
  share_layers: '' #--share_layers
  dropout: 0.25
  norm: 'batch' # 'batch' 
  checkpoint: '--checkpoint'

# Contrastive explanation for Palbociclib (CDK4/6 inhibitor) - RB1 response
# Compares MCF7 (RB1-proficient) vs MDAMB468 (RB1-deficient) cell lines
contrastive_explanation_palbociclib_rb1:
  output_dir: contrastive_explanation_palbociclib_rb1
  target_gene: 'CCNE2'
  cell_line_1: 'MCF7'
  cell_line_2: 'MDAMB468'
  pert_id: 'BRD-K51313569' # Palbociclib
  dose: 10.0
  horizon: 72
  n_time_pts: 25
  method: 'euler'
  tol: 1e-4
  hard: ''  # empty for False, '--hard' for True
  beta: 5e-4
  lr: 5e-2
  prior: 5
  iters: 500
  entropy: 1.0
  grad_norm_clip: 1.0
  free_edges: 100
  explanation_target: 'edge'

# Contrastive explanation for Trametinib (MEK inhibitor) - MAPK response
# Compares MDAMB231 (RAS-mutant, MAPK-addicted) vs MCF7 (PIK3CA-mutant, MAPK-independent)
contrastive_explanation_trametinib_mapk:
  output_dir: contrastive_explanation_trametinib_mapk
  target_gene: 'DUSP6'
  cell_line_1: 'MDAMB231'
  cell_line_2: 'MCF7'
  pert_id: 'BRD-K12343256' # Trametinib
  dose: 10.0
  horizon: 72
  n_time_pts: 25
  method: 'euler'
  tol: 1e-4
  hard: ''  # empty for False, '--hard' for True
  beta: 5e-4
  lr: 5e-2
  prior: 5
  iters: 250
  entropy: 1.0
  grad_norm_clip: 1.0
  free_edges: 100
  explanation_target: 'edge'
